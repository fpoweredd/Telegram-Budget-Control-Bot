[project]
name = "telegram-budget-control-bot"
version = "2.0.0"
description = "Shared family budget in Telegram: daily limits, nightly reports and receipt recognition with Gemini."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22,<0.23",
    "apscheduler>=3.11,<4",
    "google-genai>=2.31,<3",
    "httpx>=0.28,<1",
    "loguru>=0.7,<0.8",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "freezegun>=1.5",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
